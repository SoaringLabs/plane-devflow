name: Validate plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  skills:
    env:
      PLANE_DISPOSABLE_WINDOWS_PROFILE: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22.20.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npm install --global @openai/codex@0.163.0
      - run: npm run test:skills
      - run: npm run test:agents
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']
        include:
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm install --global @openai/codex@0.163.0
      - run: npm run test:integration
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_package.py
      - run: python3 evals/run.py --validate-only
      - run: python3 evals/execution.py --validate-only
      - run: python3 plugins/plane-devflow/scripts/plane_workflow.py demo
