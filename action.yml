name: Plane DevFlow sync
description: Synchronize one primary Plane task from a GitHub PR using trusted repository configuration.
author: Plane DevFlow contributors
inputs:
  plane-api-key:
    description: Plane personal API key stored as a repository Secret; required only in Actions mode.
    required: false
  github-token:
    description: GitHub token with contents and pull-requests read permission.
    required: true
runs:
  using: composite
  steps:
    - name: Synchronize PR lifecycle
      shell: bash
      env:
        PLANE_API_KEY: ${{ inputs.plane-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PLANE_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$PLANE_ACTION_PATH/plugins/plane-devflow/scripts/action_runner.py"
